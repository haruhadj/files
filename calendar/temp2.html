<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>2025 Monthly Calendar</title>
    <style>
        :root {
            --bg-primary: #f4f4f4;
            --bg-secondary: white;
            --text-primary: #333;
            --text-secondary: #666;
            --day-bg: #f9f9f9;
            --day-hover: #e9e9e9;
            --btn-bg: #4CAF50;
            --btn-hover: #45a049;
            --day-header-colors: #FF6B6B, #4ECDC4, #45B7D1, #FDCB6E, #6C5CE7, #FF8A5B, #2ECC71;
        }
        
        .dark-mode {
            --bg-primary: #121212;
            --bg-secondary: #1E1E1E;
            --text-primary: #E0E0E0;
            --text-secondary: #A0A0A0;
            --day-bg: #2C2C2C;
            --day-hover: #3C3C3C;
            --btn-bg: #388E3C;
            --btn-hover: #2E7D32;
            --day-header-colors: #FF6B6B, #4ECDC4, #45B7D1, #FDCB6E, #6C5CE7, #FF8A5B, #2ECC71;
        }

        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            padding: 20px; 
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
        }
        .calendar-container { 
            background-color: var(--bg-secondary); 
            border-radius: 12px; 
            box-shadow: 0 6px 12px rgba(0,0,0,0.1); 
            padding: 25px; 
            width: 650px; 
        }
        .calendar-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
        }
        .year-display {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.2em;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.3s ease;
        }
        .dark-mode .year-display {
            background-color: #388E3C;
        }
        .day-header {
            font-weight: bold;
            padding: 10px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        .day-header:nth-child(1) { color: var(--day-header-colors-1, #FF6B6B); }
        .day-header:nth-child(2) { color: var(--day-header-colors-2, #4ECDC4); }
        .day-header:nth-child(3) { color: var(--day-header-colors-3, #45B7D1); }
        .day-header:nth-child(4) { color: var(--day-header-colors-4, #FDCB6E); }
        .day-header:nth-child(5) { color: var(--day-header-colors-5, #6C5CE7); }
        .day-header:nth-child(6) { color: var(--day-header-colors-6, #FF8A5B); }
        .day-header:nth-child(7) { color: var(--day-header-colors-7, #2ECC71); }

        .month-image { 
            width: 100%; 
            height: 350px; 
            object-fit: cover; 
            margin-bottom: 15px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        .month-grid { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            gap: 8px; 
            text-align: center; 
        }
        .month-selector { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        .calendar-day {
            background-color: var(--day-bg);
            border-radius: 5px;
            padding: 10px;
            font-weight: bold;
            color: var(--text-primary);
            transition: background-color 0.3s ease;
        }
        .calendar-day:hover {
            background-color: var(--day-hover);
        }
        #uploadImageBtn, #darkModeToggle {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background-color: var(--btn-bg);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        #uploadImageBtn:hover, #darkModeToggle:hover {
            background-color: var(--btn-hover);
        }
    </style>
</head>
<body>
    <div class="calendar-container">
        <div class="calendar-header">
            <div class="month-selector">
                <button id="prevMonth">←</button>
                <select id="monthDropdown"></select>
                <button id="nextMonth">→</button>
            </div>
            <div id="yearDisplay" class="year-display">2025</div>
        </div>
        <button id="darkModeToggle">Toggle Dark Mode</button>
        <input type="file" id="monthImageUpload" accept="image/*" style="display:none;">
        <img id="monthImage" class="month-image" src="" alt="Monthly Image">
        <button id="uploadImageBtn">Upload Monthly Image</button>
        
        <div id="dayHeaders" class="month-grid">
            <div class="day-header">Su</div>
            <div class="day-header">Mo</div>
            <div class="day-header">Tu</div>
            <div class="day-header">We</div>
            <div class="day-header">Th</div>
            <div class="day-header">Fr</div>
            <div class="day-header">Sa</div>
        </div>
        <div id="calendarGrid" class="month-grid"></div>
    </div>

    <script>
        class Calendar {
            constructor() {
                this.currentDate = new Date(2025, 0, 1);
                this.monthImages = {};
                this.initMonthDropdown();
                this.setupEventListeners();
                this.renderCalendar();
                this.setupDarkMode();
            }

            initMonthDropdown() {
                const dropdown = document.getElementById('monthDropdown');
                const months = [
                    'January', 'February', 'March', 'April', 
                    'May', 'June', 'July', 'August', 
                    'September', 'October', 'November', 'December'
                ];
                months.forEach((month, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    option.textContent = month;
                    dropdown.appendChild(option);
                });
            }

            renderCalendar() {
                const grid = document.getElementById('calendarGrid');
                grid.innerHTML = '';
                const month = this.currentDate.getMonth();
                const year = this.currentDate.getFullYear();

                document.getElementById('monthDropdown').value = month;
                document.getElementById('yearDisplay').textContent = year;

                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();

                for (let i = 0; i < firstDay; i++) {
                    grid.appendChild(document.createElement('div'));
                }

                for (let day = 1; day <= daysInMonth; day++) {
                    const dayElement = document.createElement('div');
                    dayElement.textContent = day;
                    dayElement.classList.add('calendar-day');
                    grid.appendChild(dayElement);
                }

                const monthImage = document.getElementById('monthImage');
                monthImage.src = this.monthImages[`${year}-${month}`] || '';
            }

            setupEventListeners() {
                const uploadBtn = document.getElementById('uploadImageBtn');
                const fileInput = document.getElementById('monthImageUpload');
                const monthImage = document.getElementById('monthImage');

                uploadBtn.addEventListener('click', () => fileInput.click());

                fileInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            const month = this.currentDate.getMonth();
                            const year = this.currentDate.getFullYear();
                            this.monthImages[`${year}-${month}`] = event.target.result;
                            monthImage.src = event.target.result;
                        };
                        reader.readAsDataURL(file);
                    }
                });

                document.getElementById('prevMonth').addEventListener('click', () => this.changeMonth(-1));
                document.getElementById('nextMonth').addEventListener('click', () => this.changeMonth(1));
                document.getElementById('monthDropdown').addEventListener('change', (e) => {
                    this.currentDate.setMonth(parseInt(e.target.value));
                    this.renderCalendar();
                });
            }

            setupDarkMode() {
                const darkModeToggle = document.getElementById('darkModeToggle');
                
                darkModeToggle.addEventListener('click', () => {
                    document.body.classList.toggle('dark-mode');
                    
                    // Save preference to localStorage
                    const isDarkMode = document.body.classList.contains('dark-mode');
                    localStorage.setItem('darkMode', isDarkMode);
                });

                // Check for saved dark mode preference
                const savedDarkMode = localStorage.getItem('darkMode');
                if (savedDarkMode === 'true') {
                    document.body.classList.add('dark-mode');
                }
            }

            changeMonth(delta) {
                this.currentDate.setMonth(this.currentDate.getMonth() + delta);
                this.renderCalendar();
            }
        }

        new Calendar();
    </script>
</body>
</html>
